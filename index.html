<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTTP Comment Finder</title>
  <link rel="stylesheet" href="style.css"
</head>
<body>
  <h1>UTTP Comment Finder</h1>
  <div>
    <label for="videoUrl">Enter YouTube Video URL:</label>
    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=XXXXXXXXXXX">
    <button id="fetchCommentsBtn">Fetch Comments</button>
  </div>

  <p id="videoTitle">Video title will be displayed here</p>

  <p>Make sure to report every one of these comments!</p>

  <div id="output"></div>

  <script src="script.js"></script>
    
</body>
</html>
